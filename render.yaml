databases:
  - name: delivery-service-db
    plan: free
    databaseName: delivery_service
    user: delivery_service

services:
  - type: web
    name: delivery-service
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn delivery_service.wsgi:application"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: delivery_service.settings.prod
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: delivery-service-db
          property: connectionString
