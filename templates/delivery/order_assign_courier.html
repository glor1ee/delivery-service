{% extends "base.html" %}
{% block title %}<title>Assign courier — Order #{{ object.pk }}</title>{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
      <h1 class="h3 mb-4">Assign courier to order #{{ object.pk }}</h1>

      <form method="post" novalidate>
        {% csrf_token %}
        {% include "includes/form_fields.html" %}
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary">Assign</button>
          <a href="{% url 'delivery:order-detail' pk=object.pk %}" class="btn btn-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
