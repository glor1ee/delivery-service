{% extends "base.html" %}
{% block title %}<title>Log in</title>{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-5">
      <h1 class="h3 mb-4">Log in</h1>

      <form method="post" novalidate>
        {% csrf_token %}
        {% include "includes/form_fields.html" %}
        <button type="submit" class="btn btn-primary">Log in</button>
      </form>

      <p class="mt-4 mb-0 text-body-secondary">
        No account yet? <a href="{% url 'delivery:signup' %}">Sign up</a>
      </p>
    </div>
  </div>
{% endblock %}
