{% extends "base.html" %}
{% block title %}<title>Log in</title>{% endblock %}

{% block content %}
  <div class="row justify-content-center py-4">
    <div class="col-12 col-md-7 col-lg-5">
      <div class="text-center mb-4">
        <i class="bi bi-truck text-primary" style="font-size: 2.5rem;"></i>
        <h1 class="h3 mt-2 mb-1">Welcome back</h1>
        <p class="text-body-secondary">Log in to place and track orders.</p>
      </div>

      <div class="card border shadow-sm">
        <div class="card-body p-4">
          <form method="post" novalidate>
            {% csrf_token %}
            {% include "includes/form_fields.html" %}
            <button type="submit" class="btn btn-primary w-100">
              <i class="bi bi-box-arrow-in-right me-1"></i>Log in
            </button>
          </form>
        </div>
      </div>

      <p class="text-center text-body-secondary mt-4 mb-0">
        No account yet? <a href="{% url 'delivery:signup' %}">Sign up</a>
      </p>
    </div>
  </div>
{% endblock %}
