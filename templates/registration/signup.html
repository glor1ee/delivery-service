{% extends "base.html" %}
{% block title %}<title>Sign up</title>{% endblock %}

{% block content %}
  <div class="row justify-content-center py-4">
    <div class="col-12 col-md-8 col-lg-6">
      <div class="text-center mb-4">
        <i class="bi bi-person-plus text-primary" style="font-size: 2.5rem;"></i>
        <h1 class="h3 mt-2 mb-1">Create an account</h1>
        <p class="text-body-secondary">Order as a buyer, or sign up to deliver as a courier.</p>
      </div>

      <div class="card border shadow-sm">
        <div class="card-body p-4">
          <form method="post" novalidate>
            {% csrf_token %}
            {% include "includes/form_fields.html" %}
            <button type="submit" class="btn btn-primary w-100">
              <i class="bi bi-check2-circle me-1"></i>Sign up
            </button>
          </form>
        </div>
      </div>

      <p class="text-center text-body-secondary mt-4 mb-0">
        Already registered? <a href="{% url 'login' %}">Log in</a>
      </p>
    </div>
  </div>
{% endblock %}
