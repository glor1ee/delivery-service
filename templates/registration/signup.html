{% extends "base.html" %}
{% block title %}<title>Sign up</title>{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
      <h1 class="h3 mb-4">Create an account</h1>

      <form method="post" novalidate>
        {% csrf_token %}
        {% include "includes/form_fields.html" %}
        <button type="submit" class="btn btn-primary">Sign up</button>
      </form>

      <p class="mt-4 mb-0 text-body-secondary">
        Already registered? <a href="{% url 'login' %}">Log in</a>
      </p>
    </div>
  </div>
{% endblock %}
